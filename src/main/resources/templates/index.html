<!DOCTYPE html>

<html
        lang="pt-BR"
        xmlns:th="http://www.thymeleaf.org"
>
<head
        th:replace="~{fragments/head :: head('Login | VetCare')}">
</head>

<body>

<main class="login-container">

    <section class="login-banner">

        <div class="banner-content">

            <div class="logo">
                <span class="logo-icon">🐾</span>

                <h1>VetCare</h1>
            </div>

            <div class="banner-text">
                <h2>
                    Gestão simples para sua veterinária
                </h2>

                <p>
                    Gerencie clientes, pets, agendamentos,
                    pedidos e informações financeiras
                    em um único lugar.
                </p>
            </div>

        </div>

    </section>


    <section class="login-section">

        <div class="login-card">

            <div class="login-header">

                <h2>Bem-vindo!</h2>

                <p>
                    Entre com suas credenciais para acessar
                    o sistema.
                </p>

            </div>


            <form
                    id="loginForm"
                    class="login-form"
                    th:action="@{/login}"
                    method="post"
            >

                <!-- Token CSRF -->
                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>


                    <div class="password-container">

                        <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                required
                        >


                        <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="Mostrar senha"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                                type="checkbox"
                                id="lembrar"
                        >

                        <span>
                Lembrar de mim
            </span>

                    </label>

                </div>


                <button
                        type="submit"
                        class="login-button"
                >
                    Entrar
                </button>


                <!-- Erro de login -->
                <p
                        th:if="${param.error}"
                        class="message"
                >
                    E-mail ou senha inválidos.
                </p>


                <!-- Logout -->
                <p
                        th:if="${param.logout}"
                        class="message success"
                >
                    Você saiu do sistema com sucesso.
                </p>

            </form>

        </div>

    </section>

</main>


<script src="/js/script.js"></script>

</body>
</html>
