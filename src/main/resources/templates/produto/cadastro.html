<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/produto-form.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

    <title
            th:text="${produto.id == null
                ? 'Novo Produto - VetMark'
                : 'Editar Produto - VetMark'}">
        Novo Produto - VetMark
    </title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="dashboard-layout">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main-content produto-form-page">

        <div class="form-page-header">

            <div>

                <a
                        th:href="@{/produto/listagem}"
                        class="back-link">
                    ← Voltar para Produtos
                </a>

                <h1
                        th:text="${produto.id == null
                            ? 'Novo Produto'
                            : 'Editar Produto'}">
                    Novo Produto
                </h1>

                <p>
                    Cadastre as informações do produto.
                </p>

            </div>

        </div>

        <section class="form-card">

            <div class="form-card-header">

                <div class="form-icon">
                    📦
                </div>

                <div>

                    <h2>Informações do Produto</h2>

                    <p>
                        Preencha os dados abaixo para cadastrar o produto.
                    </p>

                </div>

            </div>

            <form
                    th:action="@{/produto/salvar}"
                    th:object="${produto}"
                    method="post"
                    class="produto-form">

                <input
                        type="hidden"
                        th:field="*{id}">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                <div class="form-grid">

                    <div class="form-group form-group-full">

                        <label for="nome">
                            Nome do produto
                            <span>*</span>
                        </label>

                        <input
                                type="text"
                                id="nome"
                                th:field="*{nome}"
                                placeholder="Ex.: Ração para cães"
                                maxlength="150"
                                required>

                        <div
                                class="field-error"
                                th:if="${#fields.hasErrors('nome')}"
                                th:errors="*{nome}">
                            Nome inválido
                        </div>

                    </div>

                    <div class="form-group form-group-full">

                        <label for="descricao">
                            Descrição
                        </label>

                        <textarea
                                id="descricao"
                                th:field="*{descricao}"
                                placeholder="Descreva o produto..."
                                rows="4"></textarea>

                        <div
                                class="field-error"
                                th:if="${#fields.hasErrors('descricao')}"
                                th:errors="*{descricao}">
                            Descrição inválida
                        </div>

                    </div>

                    <div class="form-group">

                        <label for="preco">
                            Preço
                            <span>*</span>
                        </label>

                        <div class="money-input">

                            <span>
                                R$
                            </span>

                            <input
                                    type="number"
                                    id="preco"
                                    th:field="*{preco}"
                                    min="0"
                                    step="0.01"
                                    placeholder="0,00"
                                    required>

                        </div>

                        <div
                                class="field-error"
                                th:if="${#fields.hasErrors('preco')}"
                                th:errors="*{preco}">
                            Preço inválido
                        </div>

                    </div>

                    <div class="form-group">

                        <label for="estoque">
                            Estoque
                            <span>*</span>
                        </label>

                        <input
                                type="number"
                                id="estoque"
                                th:field="*{estoque}"
                                min="0"
                                step="1"
                                placeholder="0"
                                required>

                        <div
                                class="field-error"
                                th:if="${#fields.hasErrors('estoque')}"
                                th:errors="*{estoque}">
                            Estoque inválido
                        </div>

                    </div>

                    <div class="form-group form-group-full">

                        <label for="ativo">
                            Status do produto
                        </label>

                        <div class="checkbox-group">

                            <label class="checkbox-label">

                                <input
                                        type="checkbox"
                                        id="ativo"
                                        th:field="*{ativo}">

                                <span>
                                    Produto ativo e disponível para venda
                                </span>

                            </label>

                        </div>

                    </div>

                </div>

                <div class="form-divider"></div>

                <div class="form-actions">

                    <a
                            th:href="@{/produto/listagem}"
                            class="btn-secondary">
                        Cancelar
                    </a>

                    <button
                            type="submit"
                            class="btn-primary">

                        <span>✓</span>

                        <span
                                th:text="${produto.id == null
                                    ? 'Cadastrar Produto'
                                    : 'Salvar Alterações'}">
                            Cadastrar Produto
                        </span>

                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
