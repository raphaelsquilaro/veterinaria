<!DOCTYPE html>

<html
        lang="pt-BR"
        xmlns:th="http://www.thymeleaf.org"
>

<head
        th:replace="~{fragments/head :: head('Dashboard | VetMark')}"
>
</head>

<body>

<div
        th:replace="~{fragments/header :: header}"
></div>

<div class="dashboard-layout">

    <div
            th:replace="~{fragments/sidebar :: sidebar}"
    ></div>


    <main class="main-content">

        <section class="dashboard-header">

            <h1>
                Dashboard
            </h1>

            <p class="welcome-message">
                Bem-vindo ao sistema de gestão veterinária.
            </p>

        </section>


        <!-- Futuramente: cards de resumo -->

        <section class="dashboard-cards">

            <div class="dashboard-card">

                <h3>
                    Agendamentos
                </h3>

                <p class="dashboard-value">
                    0
                </p>

                <span>
                Agendamentos hoje
            </span>

            </div>


            <div class="dashboard-card">

                <h3>
                    Pedidos
                </h3>

                <p class="dashboard-value">
                    R$ 0,00
                </p>

                <span>
                Faturamento do mês
            </span>

            </div>


            <div class="dashboard-card">

                <h3>
                    Gastos
                </h3>

                <p class="dashboard-value">
                    R$ 0,00
                </p>

                <span>
                Gastos do mês
            </span>

            </div>


            <div class="dashboard-card">

                <h3>
                    Lucro
                </h3>

                <p class="dashboard-value">
                    R$ 0,00
                </p>

                <span>
                Lucro do mês
            </span>

            </div>

        </section>

    </main>

</div>

<div
        th:replace="~{fragments/footer :: footer}"
></div>

<script
        th:src="@{/js/dashboard.js}"
></script>

</body>

</html>
