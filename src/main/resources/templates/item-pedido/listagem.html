<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <link
          rel="stylesheet"
          th:href="@{/css/style.css}"
  >

  <link
          rel="stylesheet"
          th:href="@{/css/item-pedido.css}"
  >

  <link
          rel="stylesheet"
          th:href="@{/css/sidebar.css}"
  >

  <link
          rel="stylesheet"
          th:href="@{/css/header.css}"
  >

  <link
          rel="stylesheet"
          th:href="@{/css/footer.css}"
  >

  <title>Itens dos Pedidos | VetMark</title>

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>


<div class="dashboard-layout">

  <aside
          th:replace="~{fragments/sidebar :: sidebar}"
  ></aside>


  <main class="main-content item-pedido-page">

    <!-- CABEÇALHO -->

    <div class="page-header">

      <div class="page-title">

        <h1>
          Itens dos Pedidos
        </h1>

        <p>
          Gerencie os serviços adicionados aos pedidos.
        </p>

      </div>


      <a
              th:href="@{/item-pedido/cadastro}"
              class="btn-primary"
      >
        <span>+</span>
        Novo Item
      </a>

    </div>


    <!-- CARD -->

    <section class="content-card">

      <div class="search-area">

        <div class="search-box">

                    <span class="search-icon">
                        🔎
                    </span>

          <input
                  type="text"
                  id="searchItemPedido"
                  placeholder="Buscar item, pedido ou serviço..."
                  autocomplete="off"
          >

        </div>

      </div>


      <!-- TABELA -->

      <div class="table-container">

        <table class="data-table">

          <thead>

          <tr>

            <th>
              Item
            </th>

            <th>
              Pedido
            </th>

            <th>
              Serviço
            </th>

            <th>
              Quantidade
            </th>

            <th>
              Valor unitário
            </th>

            <th>
              Total
            </th>

            <th>
              Ações
            </th>

          </tr>

          </thead>


          <tbody id="itemPedidoTableBody">

          <tr
                  th:each="item : ${itens}"
                  class="item-pedido-row"
          >

            <td class="item-id">

                            <span
                                    th:text="${'#' + item.id}"
                            >
                                #1
                            </span>

            </td>


            <td>

                            <span
                                    th:text="${'#' + item.pedido.id}"
                            >
                                #1
                            </span>

            </td>


            <td>

              <div class="servico-info">

                <div class="servico-avatar">
                  🩺
                </div>

                <span
                        th:text="${item.servico.nome}"
                >
                                    Consulta
                                </span>

              </div>

            </td>


            <td>

                            <span
                                    class="quantity-badge"
                                    th:text="${item.quantidade}"
                            >
                                1
                            </span>

            </td>


            <td>

                            <span
                                    th:text="${'R$ ' + #numbers.formatDecimal(item.valorUnitario, 2, 'POINT', 2, 'COMMA')}"
                            >
                                R$ 100,00
                            </span>

            </td>


            <td class="item-total">

              <strong
                      th:text="${'R$ ' + #numbers.formatDecimal(item.valorTotal, 2, 'POINT', 2, 'COMMA')}"
              >
                R$ 100,00
              </strong>

            </td>


            <td class="actions">

              <a
                      th:href="@{/item-pedido/editar/{id}(id=${item.id})}"
                      class="btn-action btn-edit"
                      title="Editar item"
              >
                ✏️
              </a>


              <a
                      th:href="@{/item-pedido/excluir/{id}(id=${item.id})}"
                      class="btn-action btn-delete"
                      title="Excluir item"
                      th:attr="data-id=${item.id}"
              >
                🗑️
              </a>

            </td>

          </tr>


          <!-- ESTADO VAZIO -->

          <tr
                  th:if="${#lists.isEmpty(itens)}"
          >

            <td
                    colspan="7"
                    class="empty-state"
            >

              <div class="empty-icon">
                🧾
              </div>

              <h3>
                Nenhum item encontrado
              </h3>

              <p>
                Ainda não existem itens cadastrados.
              </p>

              <a
                      th:href="@{/item-pedido/cadastro}"
                      class="btn-primary"
              >
                Cadastrar primeiro item
              </a>

            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>

</div>


<div
        th:replace="~{fragments/footer :: footer}"
></div>


<script
        th:src="@{/js/item-pedido.js}"
></script>

</body>

</html>
