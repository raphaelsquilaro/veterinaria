<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/item-pedido-form.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/sidebar.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/header.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/footer.css}"
    >

    <title
            th:text="${itemPedido.id == null
                ? 'Novo Item - VetMark'
                : 'Editar Item - VetMark'}"
    >
        Novo Item - VetMark
    </title>

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>


<div class="dashboard-layout">

    <aside
            th:replace="~{fragments/sidebar :: sidebar}"
    ></aside>


    <main class="main-content item-pedido-form-page">

        <!-- CABEÇALHO -->

        <div class="form-page-header">

            <div>

                <a
                        th:href="@{/item-pedido/listagem}"
                        class="back-link"
                >
                    ← Voltar para Itens
                </a>


                <h1
                        th:text="${itemPedido.id == null
                            ? 'Novo Item do Pedido'
                            : 'Editar Item do Pedido'}"
                >
                    Novo Item do Pedido
                </h1>


                <p>
                    Adicione um produto a um pedido.
                </p>

            </div>

        </div>


        <!-- CARD -->

        <section class="form-card">

            <div class="form-card-header">

                <div class="form-icon">
                    📦
                </div>

                <div>

                    <h2>
                        Informações do Item
                    </h2>

                    <p>
                        Selecione o pedido e o produto desejado.
                    </p>

                </div>

            </div>


            <form
                    th:action="@{/item-pedido/salvar}"
                    th:object="${itemPedido}"
                    method="post"
                    class="item-pedido-form"
            >

                <!-- ID -->

                <input
                        type="hidden"
                        th:field="*{id}"
                >


                <!-- CSRF -->

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >


                <div class="form-grid">

                    <!-- PEDIDO -->

                    <div class="form-group">

                        <label for="pedidoId">

                            Pedido

                            <span>*</span>

                        </label>


                        <select
                                id="pedidoId"
                                name="pedidoId"
                                required
                        >

                            <option value="">
                                Selecione o pedido
                            </option>


                            <option
                                    th:each="pedido : ${pedidos}"
                                    th:value="${pedido.id}"
                                    th:text="${'#' + pedido.id + ' - ' + pedido.cliente.nome}"
                                    th:selected="${itemPedido.pedido != null
                                        and itemPedido.pedido.id == pedido.id}"
                            >
                                Pedido
                            </option>

                        </select>

                    </div>


                    <!-- PRODUTO -->

                    <div class="form-group">

                        <label for="produtoId">

                            Produto

                            <span>*</span>

                        </label>


                        <select
                                id="produtoId"
                                name="produtoId"
                                required
                        >

                            <option value="">
                                Selecione o produto
                            </option>


                            <option
                                    th:each="produto : ${produtos}"
                                    th:value="${produto.id}"
                                    th:text="${produto.nome}"
                                    th:selected="${itemPedido.produto != null
                                        and itemPedido.produto.id == produto.id}"
                            >
                                Produto
                            </option>

                        </select>

                    </div>


                    <!-- QUANTIDADE -->

                    <div class="form-group">

                        <label for="quantidade">

                            Quantidade

                            <span>*</span>

                        </label>


                        <input
                                type="number"
                                id="quantidade"
                                th:field="*{quantidade}"
                                min="1"
                                step="1"
                                required
                        >

                    </div>


                    <!-- VALOR UNITÁRIO -->

                    <div class="form-group">

                        <label for="valorUnitario">

                            Valor unitário

                            <span>*</span>

                        </label>


                        <div class="money-input">

                            <span>
                                R$
                            </span>


                            <input
                                    type="number"
                                    id="valorUnitario"
                                    th:field="*{valorUnitario}"
                                    min="0"
                                    step="0.01"
                                    placeholder="0,00"
                                    required
                            >

                        </div>

                    </div>

                </div>


                <!-- TOTAL -->

                <div class="total-preview">

                    <div>

                        <span>
                            Total do item
                        </span>

                        <small>
                            Quantidade × valor unitário
                        </small>

                    </div>


                    <strong id="displayItemTotal">
                        R$ 0,00
                    </strong>

                </div>


                <!-- DIVISOR -->

                <div class="form-divider"></div>


                <!-- AÇÕES -->

                <div class="form-actions">

                    <a
                            th:href="@{/item-pedido/listagem}"
                            class="btn-secondary"
                    >
                        Cancelar
                    </a>


                    <button
                            type="submit"
                            class="btn-primary"
                    >

                        <span>
                            ✓
                        </span>


                        <span
                                th:text="${itemPedido.id == null
                                    ? 'Cadastrar Item'
                                    : 'Salvar Alterações'}"
                        >
                            Cadastrar Item
                        </span>

                    </button>

                </div>

            </form>

        </section>

    </main>

</div>


<div
        th:replace="~{fragments/footer :: footer}"
></div>


<script
        th:src="@{/js/item-pedido-form.js}"
></script>

</body>

</html>
