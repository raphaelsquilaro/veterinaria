<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/agendamento-form.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

    <title
            th:text="${agendamento.id == null
                ? 'Novo Agendamento - VetMark'
                : 'Editar Agendamento - VetMark'}">
        Novo Agendamento - VetMark
    </title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="dashboard-layout">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main-content agendamento-form-page">

        <div class="form-page-header">

            <div>

                <a
                        th:href="@{/agendamento/listagem}"
                        class="back-link"
                >
                    ← Voltar para Agendamentos
                </a>

                <h1
                        th:text="${agendamento.id == null
                            ? 'Novo Agendamento'
                            : 'Editar Agendamento'}"
                >
                    Novo Agendamento
                </h1>

                <p>
                    Agende um atendimento para um cliente e seu pet.
                </p>

            </div>

        </div>

        <section class="form-card">

            <div class="form-card-header">

                <div class="form-icon">
                    📅
                </div>

                <div>

                    <h2>
                        Informações do Agendamento
                    </h2>

                    <p>
                        Preencha os dados abaixo.
                    </p>

                </div>

            </div>

            <form
                    th:action="@{/agendamento/salvar}"
                    th:object="${agendamento}"
                    method="post"
                    class="agendamento-form"
            >

                <!-- ID -->

                <input
                        type="hidden"
                        th:field="*{id}"
                >

                <!-- CSRF -->

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >

                <div class="form-grid">

                    <!-- Data e hora -->

                    <div class="form-group form-group-full">

                        <label for="dataHora">
                            Data e hora
                            <span>*</span>
                        </label>

                        <input
                                type="datetime-local"
                                id="dataHora"
                                th:field="*{dataHora}"
                                required
                        >

                    </div>


                    <!-- Cliente -->

                    <div class="form-group">

                        <label for="clienteId">
                            Cliente
                            <span>*</span>
                        </label>

                        <select
                                id="clienteId"
                                name="clienteId"
                                required
                        >

                            <option value="">
                                Selecione o cliente
                            </option>

                            <option
                                    th:each="cliente : ${clientes}"
                                    th:value="${cliente.id}"
                                    th:text="${cliente.nome}"
                                    th:selected="${agendamento.cliente != null
                                        and agendamento.cliente.id == cliente.id}"
                            >
                                Cliente
                            </option>

                        </select>

                    </div>


                    <!-- Pet -->

                    <div class="form-group">

                        <label for="petId">
                            Pet
                            <span>*</span>
                        </label>

                        <select
                                id="petId"
                                name="petId"
                                required
                        >

                            <option value="">
                                Selecione o pet
                            </option>

                            <option
                                    th:each="pet : ${pets}"
                                    th:value="${pet.id}"
                                    th:text="${pet.nome}"
                                    th:selected="${agendamento.pet != null
                                        and agendamento.pet.id == pet.id}"
                            >
                                Pet
                            </option>

                        </select>

                    </div>


                    <!-- Serviço -->

                    <div class="form-group form-group-full">

                        <label for="servicoId">
                            Serviço
                            <span>*</span>
                        </label>

                        <select
                                id="servicoId"
                                name="servicoId"
                                required
                        >

                            <option value="">
                                Selecione o serviço
                            </option>

                            <option
                                    th:each="servico : ${servicos}"
                                    th:value="${servico.id}"
                                    th:text="${servico.nome}"
                                    th:selected="${agendamento.servico != null
                                        and agendamento.servico.id == servico.id}"
                            >
                                Serviço
                            </option>

                        </select>

                    </div>


                    <!-- Status -->

                    <div class="form-group">

                        <label for="status">
                            Status
                            <span>*</span>
                        </label>

                        <select
                                id="status"
                                th:field="*{status}"
                                required
                        >

                            <option value="">
                                Selecione o status
                            </option>

                            <option
                                    th:each="status : ${T(sp.senai.org.vetmark.model.enums.StatusAgendamento).values()}"
                                    th:value="${status}"
                                    th:text="${status}"
                            >
                                Status
                            </option>

                        </select>

                    </div>


                    <!-- Observações -->

                    <div class="form-group form-group-full">

                        <label for="observacoes">
                            Observações
                        </label>

                        <textarea
                                id="observacoes"
                                th:field="*{observacoes}"
                                rows="5"
                                maxlength="1000"
                                placeholder="Adicione observações sobre o agendamento..."
                        ></textarea>

                    </div>

                </div>

                <div class="form-divider"></div>

                <div class="form-actions">

                    <a
                            th:href="@{/agendamento/listagem}"
                            class="btn-secondary"
                    >
                        Cancelar
                    </a>

                    <button
                            type="submit"
                            class="btn-primary"
                    >

                        <span>✓</span>

                        <span
                                th:text="${agendamento.id == null
                                    ? 'Cadastrar Agendamento'
                                    : 'Salvar Alterações'}"
                        >
                            Cadastrar Agendamento
                        </span>

                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
