<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/agendamento.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

    <title>Agendamentos | VetMark</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="dashboard-layout">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main-content agendamento-page">

        <!-- Cabeçalho -->
        <div class="page-header">

            <div>
                <h1>Agendamentos</h1>
                <p>Gerencie os agendamentos da clínica veterinária.</p>
            </div>

            <a th:href="@{/agendamento/cadastro}" class="btn-primary">
                + Novo Agendamento
            </a>

        </div>

        <!-- Área de conteúdo -->
        <section class="content-card">

            <!-- Busca -->
            <div class="search-area">

                <div class="search-box">

                    <span>🔎</span>

                    <input
                            type="text"
                            id="searchAgendamento"
                            placeholder="Buscar agendamento..."
                    >

                </div>

            </div>

            <!-- Tabela -->
            <div class="table-container">

                <table class="data-table">

                    <thead>

                    <tr>
                        <th>Data e hora</th>
                        <th>Cliente</th>
                        <th>Pet</th>
                        <th>Serviço</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>

                    </thead>

                    <tbody id="agendamentoTableBody">

                    <!-- Agendamentos -->
                    <tr
                            th:each="agendamento : ${agendamentos}"
                            class="agendamento-row"
                    >

                        <!-- Data e hora -->
                        <td
                                th:text="${#temporals.format(
                                    agendamento.dataHora,
                                    'dd/MM/yyyy HH:mm'
                                )}"
                        >
                            01/01/2026 10:00
                        </td>

                        <!-- Cliente -->
                        <td
                                th:text="${agendamento.cliente.nome}"
                        >
                            Cliente
                        </td>

                        <!-- Pet -->
                        <td
                                th:text="${agendamento.pet.nome}"
                        >
                            Pet
                        </td>

                        <!-- Serviço -->
                        <td
                                th:text="${agendamento.servico.nome}"
                        >
                            Serviço
                        </td>

                        <!-- Status -->
                        <td>

                            <span
                                    class="status-badge"
                                    th:text="${agendamento.status}"
                            >
                                Agendado
                            </span>

                        </td>

                        <!-- Ações -->
                        <td class="actions">

                            <a
                                    th:href="@{/agendamento/editar/{id}(id=${agendamento.id})}"
                                    class="btn-action btn-edit"
                                    title="Editar"
                            >
                                ✏️
                            </a>

                            <a
                                    th:href="@{/agendamento/excluir/{id}(id=${agendamento.id})}"
                                    class="btn-action btn-delete"
                                    title="Excluir"
                                    th:attr="data-id=${agendamento.id}"
                            >
                                🗑️
                            </a>

                        </td>

                    </tr>

                    <!-- Estado vazio -->
                    <tr th:if="${#lists.isEmpty(agendamentos)}">

                        <td
                                colspan="6"
                                class="empty-state"
                        >

                            <div class="empty-icon">
                                📅
                            </div>

                            <h3>Nenhum agendamento encontrado</h3>

                            <p>
                                Ainda não existem agendamentos cadastrados.
                            </p>

                            <a
                                    th:href="@{/agendamento/cadastro}"
                                    class="btn-primary"
                            >
                                Criar primeiro agendamento
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/agendamento.js}"></script>

</body>

</html>
